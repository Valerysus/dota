name: Test and Build Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run build script (regenerate index.html)
        run: python build_site.py

      - name: Verify index.html is up to date
        run: git diff --exit-code index.html

      - name: Run Node test suite
        run: node --test tests/*.test.js
